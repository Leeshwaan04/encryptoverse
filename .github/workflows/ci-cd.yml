name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Refresh the generated page data (prices, TVL, rankings) and redeploy every six hours.
  schedule:
    - cron: '17 */6 * * *'

# One pipeline per branch. A production deploy is never cancelled mid-flight;
# superseded PR checks are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Third-party actions are pinned to commit SHAs: a tag can be moved to point at
# new code, a SHA cannot. Dependabot raises PRs to move these forward.
jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The 40,000+ programmatic pages read static JSON built from free public APIs (CoinLore, DefiLlama). Retry because
      # upstreams occasionally rate-limit shared CI addresses; if every attempt fails the pipeline stops and the
      # previous deployment stays live.
      - name: Build page data
        run: |
          ok=0
          for attempt in 1 2 3; do
            if npm run data; then ok=1; break; fi
            echo "data build failed (attempt $attempt), retrying in 45s"
            sleep 45
          done
          [ "$ok" = 1 ]

      # Checks every generated page (about 42,000): titles, descriptions, thin content, indexing rules, broken
      # internal links, orphans and click depth. Fails the pipeline on any hard problem.
      - name: Audit every page
        run: npm run audit:pages

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      - name: Install Chromium for browser tests
        run: npx playwright install --with-deps chromium

      # Serve the real production bundle, so the suites test what will ship.
      - name: Start preview server
        run: |
          npm run preview &
          npx wait-on -t 60000 http://localhost:4173/

      # 55 end-to-end checks: currency handling, accessibility, resilience,
      # corrupt-storage robustness and the data-honesty regressions.
      - name: QA suite
        run: npm run test:qa

      # Client-side security: injection via URL params and hostile API payloads,
      # prototype pollution, clickjacking, data egress, wallet method safety.
      - name: Security suite
        run: npm run test:security

      # The deploy job ships this exact artifact, so what was verified is what goes live.
      - name: Upload build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails the PR if it introduces a dependency with a known advisory.
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://encryptoverse.com
    permissions:
      contents: read
      deployments: write
    steps:
      # wrangler.toml lives in the repo root and is read during deploy.
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=encryptoverse --branch=main
