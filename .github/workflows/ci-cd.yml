name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One pipeline per branch. A production deploy is never cancelled mid-flight;
# superseded PR checks are.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck and build
        run: npm run build

      # The deploy job ships this exact artifact, so what was verified is what goes live.
      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy to Cloudflare Pages
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: Production
      url: https://encryptoverse.com
    permissions:
      contents: read
      deployments: write
    steps:
      # wrangler.toml lives in the repo root and is read during deploy.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '60b50388dc161e3a172c8a5fc35ba3a9' }}
          command: pages deploy dist --project-name=encryptoverse --branch=main
